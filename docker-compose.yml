# PostgreSQL 15 para desarrollo. Los .sql de database/ se ejecutan en orden alfabético
# la primera vez que se crea el volumen: 01_schema -> 02_ajustes_idioms -> 03_semillas.
services:
  db:
    image: postgres:15
    container_name: steps-db
    environment:
      POSTGRES_DB: steps
      POSTGRES_USER: steps
      POSTGRES_PASSWORD: steps_dev
    ports:
      - "5433:5432"
    volumes:
      - steps-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
volumes:
  steps-data:
